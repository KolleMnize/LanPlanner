<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">AnythingButAZombieGame - Lan Planner</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarColor01"
      aria-controls="navbarColor01"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarColor01">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a
            class="nav-link active"
            routerLink="/home"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >Home
            <span class="visually-hidden">(current)</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/events"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >Events</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/catalog"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >Catalog</a
          >
        </li>
      </ul>
      <div class="d-flex align-items-center">
        @if (user(); as u) {
          <span class="navbar-text"
            >Angemeldet als <strong>{{ u.name }}</strong></span
          >
        } @else {
          <span class="navbar-text text-warning">Nicht angemeldet</span>
        }
      </div>
    </div>
  </div>
</nav>
@if (needsRegistration()) {
  <div class="container mt-4" style="max-width: 28rem">
    <h4>Willkommen! Wähle einen Nutzernamen</h4>
    <div class="input-group mb-2">
      <input #nameInput class="form-control" maxlength="30" placeholder="Nutzername" />
      <button class="btn btn-primary" type="button" (click)="register(nameInput.value)">
        Weiter
      </button>
    </div>
    @if (registerError(); as err) {
      <div class="text-danger">{{ err }}</div>
    }
  </div>
} @else {
  <router-outlet></router-outlet>
}
